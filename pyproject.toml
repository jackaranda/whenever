[project]
name = "whenever"
version = "0.1.0"
description = "Shared calendars with per-user CalDAV and ICS access"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "icalendar>=6.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "caldav>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whenever*"]

[tool.setuptools.package-data]
whenever = ["admin/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
